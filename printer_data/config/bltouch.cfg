
[safe_z_home]
home_xy_position: 122.95, 100.718
speed: 50
z_hop: 10
z_hop_speed: 15

[bltouch] # enable for BLTouch
sensor_pin: ^PC4
control_pin: PA8
# probe_with_touch_mode: True # for original BLTouch v 3.0
# x_offset: 18
# y_offset: -42

# Voron
X_offset: -32.950
Y_offset: -10.718

[bed_mesh]
mesh_min: 10, 10
mesh_max: 142.05, 169.282
probe_count: 4,4
speed: 100
algorithm: bicubic

[gcode_macro DYNAMIC_BED_MESH_TEST]
description: 계산된 메쉬 범위를 콘솔에 출력하여 확인
gcode:
    # 1. 설정값 불러오기
    {% set x_off = printer.configfile.settings.bltouch.x_offset | float %}
    {% set y_off = printer.configfile.settings.bltouch.y_offset | float %}
    {% set probe_edge = 10.0 | float %}
    
    # 2. 베드 크기 정의
    {% set bed_max_x = 180.0 %}
    {% set bed_max_y = 180.0 %}

    # 3. 자동 계산 로직
    # X Min: 오프셋이 양수면 오프셋 자체가 최소 도달 거리
    {% set mesh_min_x = [x_off, probe_edge] | max %}
    {% set mesh_min_y = [y_off + probe_edge, probe_edge] | max %}
    
    # X Max: 베드 끝에서 프로브 오프셋만큼 뺀 지점
    {% set mesh_max_x = bed_max_x - [x_off, 0] | max - probe_edge %}
    {% set mesh_max_y = bed_max_y - [y_off, 0] | max - probe_edge %}

    # 4. 콘솔 출력 (DEBUG용)
    { action_respond_info("--- Dynamic Mesh Calculation ---") }
    { action_respond_info("Probe Offsets: X=%.3f, Y=%.3f" % (x_off, y_off)) }
    { action_respond_info("Calculated Mesh Min: X=%.3f, Y=%.3f" % (mesh_min_x, mesh_min_y)) }
    { action_respond_info("Calculated Mesh Max: X=%.3f, Y=%.3f" % (mesh_max_x, mesh_max_y)) }
    { action_respond_info("---------------------------------") }

    # 5. 실제 실행부 주석 처리 (확인 후 필요시 해제)
    # BED_MESH_CALIBRATE MESH_MIN={mesh_min_x},{mesh_min_y} MESH_MAX={mesh_max_x},{mesh_max_y} PROBE_COUNT=4,4
