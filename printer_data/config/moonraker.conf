# Sonar update_manager entry
[update_manager sonar]
type: git_repo
path: ~/sonar
origin: https://github.com/mainsail-crew/sonar.git
primary_branch: main
managed_services: sonar
system_dependencies: resources/system-dependencies.json

# KAMP
[update_manager Klipper-Adaptive-Meshing-Purging]
type: git_repo
channel: dev
path: ~/Klipper-Adaptive-Meshing-Purging
origin: https://github.com/kyleisah/Klipper-Adaptive-Meshing-Purging.git
managed_services: klipper
primary_branch: main
[update_manager mobileraker]
install_script: /home/han/mobileraker_companion/scripts/install.sh
requirements: /home/han/mobileraker_companion/scripts/mobileraker-requirements.txt
env: /home/han/mobileraker-env/bin/python
managed_services: mobileraker
primary_branch: main
origin: https://github.com/Clon1998/mobileraker_companion.git
path: /home/han/mobileraker_companion
type: git_repo

[update_manager fluidd]
path: /home/han/fluidd
repo: fluidd-core/fluidd
channel: stable
type: web

[include moonraker-obico-update.cfg]

[include octoeverywhere-system.cfg]
[update_manager klipper-backup]
type: git_repo
path: ~/klipper-backup
origin: https://github.com/Staubgeborener/klipper-backup.git
managed_services: moonraker
primary_branch: main