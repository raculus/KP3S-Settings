[gcode_macro SET_ACTIVE_SPOOL]
gcode:
  {% set id = params.ID|default(0)|int %}
  {% if id == 0 %}
    {action_respond_info("Clear active spool")}
    {action_call_remote_method("spoolman_set_active_spool", spool_id=None)}
  {% else %}
    {action_call_remote_method("spoolman_set_active_spool", spool_id=id)}
  {% endif %}

[gcode_macro CLEAR_ACTIVE_SPOOL]
gcode:
  SET_ACTIVE_SPOOL ID=0

[gcode_macro PRINT_START]
gcode:
    {% set EXTRUDER_TEMP = printer.extruder.temperature|float %}
    {% set EXTRUDER = params.EXTRUDER|float %}
    {% set BED = params.BED|default(60)|float %}    
    RESPOND MSG="EXTRUDER: {EXTRUDER}"
    {% if EXTRUDER_TEMP > 130 %}
      M140 S{BED}
      M190 S{BED}
    {% else %}    
      {% set PRE_EXTRUDER = 130 %}
      # RESPOND MSG="PRE_EXTRUDER: {PRE_EXTRUDER}, BED: {BED}"
      # Start bed, extruder heating
      # M104 S{PRE_EXTRUDER}
      M140 S{BED}
      # M109 S{PRE_EXTRUDER}
      M190 S{BED}
    {% endif %}

    # Use absolute coordinates
    G90
    # Home the printer
    G28  
    BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN=15
    # BED_MESH_PROFILE LOAD="default"

    G1 X5 Y5 Z5.0 F3000.0    
    M104 S{EXTRUDER}
    M109 S{EXTRUDER}

    LINE_PURGE
    
[gcode_macro PRINT_END]
# rename_existing: END_PRINT
gcode:
    G92 E0.0

    G1 E-1.0 F500 ; retract

    M104 S0 ; turn off temperature

    M140 S0 ; turn off heatbed

    M107 ; turn off fan

    G91 ;relative positioning
    G1 Z+0.5 F3000 ;move Z up
    G90 ;absolute positioning

    G1 X10 Y170 F3000 ; park print head

    M84 ; disable motors
    SET_IDLE_TIMEOUT TIME=60

[gcode_macro PARK]
gcode:
    PAUSE

[gcode_macro M600]
description: Filament change macro
gcode:
  {% if printer.toolhead.homed_axes != "xyz" %}
    M118 Homing
    G28
  {% endif %}
  {% if printer.extruder.can_extrude == 0 %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% if act_z > (max_z - 20.0) %}
        {% set z_safe = max_z %}
    {% else %}
        {% set z_safe = (act_z + 20.0) %}
    {% endif %}
    G91
    G1 Z{z_safe}
    G90
    G1 X0 Y0 F2100
    M118 Acquiring temperature
    M109 S200
  {% endif %}  
  {% if printer.pause_resume.is_paused == 0 %}
    PAUSE
  {% endif %}
  M118 First UNLOAD, then LOAD new and RESUME when ready

[gcode_macro UNLOAD]
description: Unload filament helper
gcode: 
  {% if printer.pause_resume.is_paused == 1 %}
    {% if printer.extruder.can_extrude == 1 %}
      G91
      G1 E5 F300
      G1 E-50 F300
      G90
    {% else %}
      RESPOND TYPE=error MSG="Extrude below minimum temp"
    {% endif %}
  {% else %}
    RESPOND TYPE=error MSG="Printer must be paused"
  {% endif %}

[gcode_macro LOAD]
description: Load filament helper
gcode:
  {% if printer.pause_resume.is_paused == 1 %}
    {% if printer.extruder.can_extrude == 1 %}
      G91
      G1 E20 F300
      G90
    {% else %}
      RESPOND TYPE=error MSG="Extrude below minimum temp"
    {% endif %}
  {% else %}
    RESPOND TYPE=error MSG="Printer must be paused"
  {% endif %}

[gcode_macro LOW_TEMP_CHECK_T]
gcode: 
    {% if printer.extruder.target != 0 %} # if there is a setpoint for extruder
        {% if printer.extruder.temperature < printer.extruder.target %} # if not reached, heat
#            M118 Heating from {printer.extruder.temperature} to {printer.extruder.target}.
            M109 S{printer.extruder.target|float} 
        {% endif %}
    {% else %} # if no setpoint for extruder
        {% if printer.extruder.target < T %}  # heat to T.
#            M118 No setpoint, heating to {T}.
            M109 S{T}
        {% endif %}
    {% endif %}

[gcode_macro M900]
description: Set pressure advance
gcode:
  SET_PRESSURE_ADVANCE ADVANCE={params.K|default(0)}

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    ##### set defaults #####
    {% set x = params.X|default(10) %}       #edit to your park position
    {% set y = params.Y|default(170) %}      #edit to your park position
    {% set z = params.Z|default(20)|float %} #edit to your park position
    {% set e = params.E|default(1) %}        #edit to your retract length
    ##### calculate safe lift position #####
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% set lift_z = z|abs %}
    {% if act_z < (max_z - lift_z) %}
        {% set z_safe = lift_z %}
    {% else %}
        {% set z_safe = max_z - act_z %}
    {% endif %}
    ##### end of definitions #####
    SAVE_GCODE_STATE NAME=PAUSE_state
    BASE_PAUSE
    G91
    G1 E-{e} F300
    G1 Z{z_safe}
    G90
    G1 X{x} Y{y} F4000

[gcode_macro RESUME]
rename_existing: BASE_RESUME
gcode:
    ##### set defaults #####
    {% set e = params.E|default(1) %} #edit to your retract length
    G91
    G1 E{e} F300
    G90
    RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1
    BASE_RESUME  

