# [include fluidd.cfg]
# [include mainsail.cfg]
[include ./bltouch.cfg]
[include ./tmc.cfg]
[include moonraker_obico_macros.cfg]

#####################################
#              ADXL              #
#####################################
[mcu rpi]
serial: /tmp/klipper_host_mcu
[adxl345]
cs_pin: rpi:None

[resonance_tester]
accel_chip: adxl345
probe_points:
    100, 100, 20  # an example


#####################################
#              KAMP              #
#####################################
[exclude_object]
[include KAMP_Settings.cfg]
[firmware_retraction]
retract_length: 0.4
#   The length of filament (in mm) to retract when G10 is activated,
#   and to unretract when G11 is activated (but see
#   unretract_extra_length below). The default is 0 mm.
retract_speed: 20
#   The speed of retraction, in mm/s. The default is 20 mm/s.
unretract_extra_length: 0
#   The length (in mm) of *additional* filament to add when
#   unretracting.
unretract_speed: 10
#   The speed of unretraction, in mm/s. The default is 10 mm/s.

#####################################
#              PRINTER              #
#####################################

[printer]
kinematics: cartesian
max_velocity: 250
max_accel: 3000
# max_accel_to_decel:1800
max_z_velocity: 15
max_z_accel: 100
square_corner_velocity: 5.0

[input_shaper]
shaper_freq_x: 78.8 #23.0
shaper_freq_y: 48.6 #39.0
shaper_type_x: mzv
shaper_type_y: 3hump_ei #mzv

[bed_screws]
#need calibration
screw1: 20,20
screw2: 160,20
screw3: 160,160
screw4: 20,160

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
baud: 250000
restart_method: command


[temperature_sensor MCU]
sensor_type: temperature_mcu

[static_digital_output display_reset]
pins: !PC6, !PD13

[virtual_sdcard]
path: ~/printer_data/gcodes

[gcode_arcs]
resolution: 0.05

[display_status]

[pause_resume] 

[respond]
default_type: echo
#   Sets the default prefix of the "M118" and "RESPOND" output to one
#   of the following:
#       echo: "echo: " (This is the default)
#       command: "// "
#       error: "!! "
#default_prefix: echo:
#   Directly sets the default prefix. If present, this value will
#   override the "default_type".


#####################################
#        Heater Verification        #
#####################################

[verify_heater heater_bed]
max_error: 120
check_gain_time: 60
hysteresis: 5
heating_gain: 2

[verify_heater extruder]
max_error: 180         # 기존 120에서 180으로 대폭 증액 (급격한 온도 하락에 대응)
check_gain_time: 40    # 유지
hysteresis: 10         # 기존 5에서 10으로 증액 (온도가 출렁여도 에러 안 나게 함)
heating_gain: 2


#####################################
#              BEEPER               #
#####################################

#[output_pin _BEEPER_pin]
#pin: PC5
#pwm: true
#value: 1
#shutdown_value: 0
#cycle_time: 0.001
#scale: 1000


#####################################
#           Filament Sensor         #
#####################################

[filament_switch_sensor FilamentSensor]
pause_on_runout: False
runout_gcode: 
    M118 Starting filament change
    M600
insert_gcode:
switch_pin: !PA4
event_delay: 5.0


#####################################
#              STEPPER              #
#####################################

[stepper_x]
step_pin: PE3
dir_pin: PE2
enable_pin: !PE4
full_steps_per_rotation: 200
microsteps: 32
# endstop_pin: tmc2209_stepper_x:virtual_endstop # enable to use Sensorless
rotation_distance: 40
endstop_pin: !PA15 # disable to use Sensorless
position_endstop: 5
position_min: 5
position_max: 175
homing_speed: 50
homing_retract_dist: 0
second_homing_speed: 3

[stepper_y]
step_pin: PE0
dir_pin: PB9
enable_pin: !PE1
full_steps_per_rotation: 200
microsteps: 32
rotation_distance: 40
# endstop_pin: tmc2209_stepper_y:virtual_endstop # enable to use Sensorless
endstop_pin: !PA12  # disable to use Sensorless
position_endstop: 5
position_min: 5
position_max: 175
homing_speed: 50
homing_retract_dist: 0
second_homing_speed: 3

[stepper_z]
step_pin: PB5
dir_pin: !PB4
enable_pin: !PB8
full_steps_per_rotation: 200
microsteps: 32
rotation_distance: 8
position_max: 175
homing_retract_dist: 10.0
second_homing_speed: 5
endstop_pin: probe:z_virtual_endstop  # enable to use BLTouch
# position_min: -1
position_min: -5 # enable to use BLTouch
# endstop_pin: !PA11 # disable to use BLTouch
#position_endstop: 0 # disable to use BLTouch


#####################################
#            THERMISTOR             #
#####################################

[thermistor Kingroon_Calibrated B3950]
temperature1: 25.0
resistance1: 103180.0
temperature2: 150.0
resistance2: 1366.2
temperature3: 250.0
resistance3: 168.6

#####################################
#             EXTRUDER              #
#####################################

[extruder]
step_pin: PD6
dir_pin: PD3
enable_pin: !PB3
full_steps_per_rotation: 200
microsteps: 32
max_extrude_cross_section: 5
#   Maximum area (in mm^2) of an extrusion cross section (eg,
#   extrusion width multiplied by layer height). This setting prevents
#   excessive amounts of extrusion during relatively small XY moves.
#   If a move requests an extrusion rate that would exceed this value
#   it will cause an error to be returned. The default is: 4.0 *
#   nozzle_diameter^2
#rotation_distance: 31.776 #red head

# Sherpa Extra Heavy nema 17 ->
rotation_distance: 7.849

# Titan Extruder ->
# rotation_distance: 8.333


nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC3
sensor_type: ATC Semitec 104NT-4-R025H42G  #EPCOS 100K B57560G104F
sensor_pin: PC1
#control: pid
#pid_Kp: 30.446
#pid_Ki: 6.999
#pid_Kd: 33.110
min_temp: 0
max_temp: 340
min_extrude_temp: 0
max_extrude_only_distance: 200
# pressure_advance: 0.08175  #16.35
# pressure_advance_smooth_time = 0.040

#####################################
#               BED                 #
#####################################

[heater_bed]
heater_pin: PA0
sensor_type: Kingroon_Calibrated B3950
sensor_pin: PC0
#control: pid
#pid_Kp: 67.612
#pid_Ki: 2.265
#pid_Kd: 504.558
min_temp: 0
max_temp: 130


#####################################
#               FAN                 #
#####################################

[fan]
pin: PB1

[heater_fan my_nozzle_fan]
pin: PB0
heater: extruder
heater_temp: 50.0
fan_speed: 1.0
shutdown_speed: 1

#####################################
#              MACROS               #
#####################################
[include ./macros.cfg]

